# Section names are API model IDs referenced by Open WebUI presets and metrics.
# Renaming one also requires updating those references. hf-file selects the exact
# quantization; the downloader reads this file and shares the runtime model cache.
# load-on-startup=false defers loading weights until a request needs the model.
# jinja enables the model chat template, including structured conversation roles.
# draft-mtp requests multi-token prediction; the selected model and llama.cpp
# build must support it. spec-draft-n-max caps draft tokens per speculative step.
# Server-wide context, GPU offloading and batch sizes are set in Compose/.env.
[Qwen3.8-27B]
hf-repo = unsloth/Qwen3.8-27B-GGUF
hf-file = Qwen3.8-27B-UD-Q4_K_M.gguf
load-on-startup = false
jinja = true
spec-type = draft-mtp
spec-draft-n-max = 4

