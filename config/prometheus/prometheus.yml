# Scrape only internal endpoints. Dynamic model targets are provided by the
# coordinator so monitoring does not load otherwise idle models.
global:
  # Frequent scrapes support the live dashboard; timeout must stay below interval.
  scrape_interval: 2s
  scrape_timeout: 1500ms
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/rules.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: llama-metrics-discovery
    static_configs:
      - targets: ["llama-metrics-discovery:9091"]

  - job_name: llama-cpp
    metrics_path: /metrics
    scheme: http

    authorization:
      type: Bearer
      credentials_file: /run/secrets/llama_cpp_api_key

    # llama.cpp router metrics require ?model=<loaded-model>. The discovery
    # service returns only models whose router status is currently "loaded".
    http_sd_configs:
      - url: http://llama-metrics-discovery:9091/targets.json
        refresh_interval: 1s

    relabel_configs:
      - source_labels: [llama_model_id]
        target_label: __param_model
      # Translate labels to query parameters; autoload=false prevents a scrape
      # from reloading weights if a model unloads between discovery and scraping.
      - target_label: __param_autoload
        replacement: "false"
      - target_label: service
        replacement: llama-cpp
      - target_label: component
        replacement: inference
