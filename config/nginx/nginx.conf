# TLS gateway: / serves Open WebUI, /v1/ serves llama.cpp, /grafana/ serves
# dashboards, and the separate 8444 listener serves ComfyUI. Listener ports are
# container ports; docker-compose.yml publishes their host-side counterparts.
user nginx;
worker_processes auto;

error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'request_time=$request_time upstream_time=$upstream_response_time';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65s;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    # Allow large prompts, images and Open WebUI file uploads.
    client_max_body_size 100m;

    # Upgrade WebSocket connections only when requested by the client.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # Limit new API requests to 10 per second per client IP.
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;

    # Docker DNS follows backend IP changes after container recreation.
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    upstream llama_cpp_backend {
        zone llama_cpp_backend 64k;
        server llama-cpp:8000 resolve;
        keepalive 32;
    }

    upstream openwebui_backend {
        zone openwebui_backend 64k;
        server openwebui:8080 resolve;
        keepalive 16;
    }

    upstream comfyui_backend {
        zone comfyui_backend 64k;
        server comfyui:8188 resolve;
        keepalive 16;
    }

    upstream grafana_backend {
        zone grafana_backend 64k;
        server grafana:3000 resolve;
        keepalive 16;
    }

    # Redirect unencrypted HTTP to the TLS gateway.
    server {
        listen 80 default_server;
        listen [::]:80 default_server;
        server_name _;

        return 301 https://$host:8443$request_uri;
    }

    server {
        listen 443 ssl default_server;
        listen [::]:443 ssl default_server;
        server_name _;

        ssl_certificate /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        # Do not include subdomains or request HSTS preload for internal deployments.
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Open WebUI fetches FileReader data URLs before posting image uploads.
        # An explicit connect-src overrides default-src, so it must allow data: too.
        add_header Content-Security-Policy "default-src 'self' 'unsafe-inline' 'unsafe-eval' data: blob: https:; connect-src 'self' data: https: wss:; img-src 'self' data: blob: https:; frame-ancestors 'none';" always;

        # These are connection/inactivity limits, not a total generation deadline.
        proxy_connect_timeout 30s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;

        # OpenAI-compatible llama.cpp API, including streaming.
        location /v1/ {
            limit_req zone=api_limit burst=20 nodelay;

            proxy_pass http://llama_cpp_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";

            # Forward generated tokens immediately instead of collecting a response.
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_cache off;
            chunked_transfer_encoding on;

            # Return API gateway errors as OpenAI-style JSON responses.
            proxy_intercept_errors on;
            error_page 429 = @json_429;
            error_page 502 = @json_502;
            error_page 503 = @json_503;
            error_page 504 = @json_504;
        }

        # Public llama.cpp readiness endpoint.
        location = /health {
            proxy_pass http://llama_cpp_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Connection "";
            proxy_buffering off;
        }

        # Keep native llama.cpp metrics internal to Prometheus.
        location = /metrics {
            access_log off;
            deny all;
        }

        # Serve Grafana under /grafana/, matching GF_SERVER_SERVE_FROM_SUB_PATH.
        location = /grafana {
            return 301 /grafana/;
        }

        location /grafana/ {
            proxy_pass http://grafana_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
        }

        # Open WebUI is the default interface.
        location / {
            proxy_pass http://openwebui_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
        }

        location @json_429 {
            default_type application/json;
            return 429 '{"error":{"message":"Too many requests. Please retry later.","type":"rate_limit_error","code":429}}';
        }

        location @json_502 {
            default_type application/json;
            return 502 '{"error":{"message":"The inference server is starting or temporarily offline.","type":"api_error","code":502}}';
        }

        location @json_503 {
            default_type application/json;
            return 503 '{"error":{"message":"The inference server is overloaded or unavailable.","type":"api_error","code":503}}';
        }

        location @json_504 {
            default_type application/json;
            return 504 '{"error":{"message":"The inference request exceeded the gateway timeout.","type":"timeout_error","code":504}}';
        }
    }

    # ComfyUI has no extra authentication here; this listener relies on trusted
    # network access and does not inherit Open WebUI login/session protection.
    # Use a dedicated TLS origin for ComfyUI so absolute asset and WebSocket URLs work.
    server {
        listen 8444 ssl;
        listen [::]:8444 ssl;
        server_name _;

        ssl_certificate /etc/nginx/certs/nginx.crt;
        ssl_certificate_key /etc/nginx/certs/nginx.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_cache shared:SSL:10m;
        ssl_session_timeout 1d;
        ssl_session_tickets off;

        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        client_max_body_size 1g;
        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;
        proxy_read_timeout 3600s;

        location / {
            proxy_pass http://comfyui_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_buffering off;
            proxy_request_buffering off;
        }
    }
}
