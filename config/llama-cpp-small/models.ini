# Small task-model router; this ID is used by TASK_MODEL_EXTERNAL.
# Unlike the main chat presets, this model loads when the service starts.
# Actual CPU/GPU placement is controlled by Compose --gpu-layers, not this file.
# hf-file chooses the cached quantization; jinja enables its chat template.
[Qwen3.5-4B]
hf-repo = mradermacher/Huihui-Qwen3-4B-abliterated-v2-GGUF
hf-file = Huihui-Qwen3-4B-abliterated-v2.Q4_K_M.gguf
load-on-startup = true
jinja = true
